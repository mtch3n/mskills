<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <nav class="side" aria-label="Main">
    <span class="brand">Ledgerly</span>
    <a href="dashboard.html" aria-current="page"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5"/><rect x="9" y="2" width="5" height="5"/><rect x="2" y="9" width="5" height="5"/><rect x="9" y="9" width="5" height="5"/></svg><span>Dashboard</span></a>
    <a href="invoices.html"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 2h8v12H4z"/><path d="M6 6h4M6 9h4"/></svg><span>Invoices</span></a>
    <a href="settings.html"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.5"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2"/></svg><span>Settings</span></a>
  </nav>
  <main class="page">
    <p class="eyebrow">Overview</p>
    <h1>Dashboard</h1>
    <p class="lead">Here is a quick look at how your business is doing this month.</p>
    <div class="stats">
      <div class="stat"><div class="tile"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12l4-4 3 3 5-6"/></svg></div><h3>Revenue this month</h3><p class="value">$12,400</p></div>
      <div class="stat"><div class="tile"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12l4-4 3 3 5-6"/></svg></div><h3>Open invoices</h3><p class="value">38</p></div>
      <div class="stat"><div class="tile"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12l4-4 3 3 5-6"/></svg></div><h3>Overdue</h3><p class="value">4</p></div>
    </div>
    <h2>Recent invoices</h2>
    <table class="table">
      <thead><tr><th>Client</th><th>Amount</th><th>Status</th></tr></thead>
      <tbody>
        <tr><td>Acme Ltd</td><td>$1,200</td><td>Paid</td></tr>
        <tr><td>Northwind</td><td>$860</td><td>Overdue</td></tr>
      </tbody>
    </table>
  </main>
</div>
</body>
</html>
