<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings - Tallybook</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
<aside class="side">
<nav aria-label="Settings">
<div class="row">Account</div>
<a class="row" href="#profile">Profile<span class="hint">⌘P</span></a>
<a class="row" href="#password">Password<span class="hint inline">⌘K</span></a>
<a class="row" href="#notifications">Notifications</a>
<div class="row">Workspace</div>
<a class="row" href="#members">Members<span class="hint inline">⌘M</span></a>
<a class="row" href="#billing">Billing<span class="hint">⌘B</span></a>
<a class="row" href="#domains">Domains</a>
<div class="row">Developer</div>
<a class="row" href="#api-keys">API keys<span class="hint">⌘A</span></a>
<a class="row" href="#webhooks">Webhooks<span class="hint inline">⌘W</span></a>
</nav>
</aside>
<main>
<h1>Profile</h1>
<p>Your name and email are visible to the members of your workspace.</p>
<div class="field"><label for="name">Name</label><input id="name" value="Dana Reyes"></div>
<div class="field"><label for="email">Email</label><input id="email" type="email" value="dana@example.com"></div>
<button class="button" type="button">Save</button>
</main>
</div>
</body>
</html>
