<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <span class="brand">Dropbox Lite</span>
  <nav>
    <a href="files.html">Files</a>
    <a href="shared.html">Shared</a>
    <a href="settings.html" aria-current="page">Settings</a>
  </nav>
</header>
<main class="page">
  <h1>Settings</h1>
  <div class="card">
    <div class="card">
      <h2>Profile</h2>
      <div class="field"><label for="name">Name</label><input class="input" id="name" value="Sam Lee"></div>
      <div class="field"><label for="mail">Email</label><input class="input" id="mail" value="sam@example.com"></div>
    </div>
    <div class="card">
      <h2>Storage</h2>
      <div class="field"><label for="keep">Keep files for</label><input class="input" id="keep" value="30 days"></div>
      <button class="button">Save</button>
    </div>
  </div>
</main>
</body>
</html>
