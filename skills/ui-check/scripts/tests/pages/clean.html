<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Files</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 Arial, sans-serif; color: #1f2937; background: #ffffff; }
  main { max-width: 1120px; margin: 0 auto; padding: 24px; }
  h1 { margin: 0 0 16px; font-size: 32px; line-height: 40px; }
  .lead { margin: 0 0 24px; color: #4b5563; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .toolbar input { height: 40px; width: 240px; max-width: 100%; border: 1px solid #d1d5db; border-radius: 6px; padding: 0 12px; font: inherit; }
  .btn { height: 40px; border: 0; border-radius: 6px; font: inherit; color: #ffffff; background: #1f2937; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn svg { width: 16px; height: 16px; }
  .stack > * { margin: 0; padding: 12px 16px; border: 1px solid #e5e7eb; border-radius: 8px; }
  .stack > * + * { margin-top: 16px; }
  .note { margin: 24px 0 0; color: #4b5563; }
  .tags { display: flex; gap: 8px; margin-top: 16px; }
  .tag { border-radius: 4px; padding: 2px 8px; font-size: 14px; background: #f3f4f6; color: #374151; }
  table { margin-top: 24px; border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #e5e7eb; }
  th:nth-child(2), td:nth-child(2) { text-align: right; font-variant-numeric: tabular-nums; }
  th { font-size: 14px; }
  th.actions, td.actions { text-align: right; }
  .panel { margin-top: 24px; max-width: 420px; padding: 12px; border: 1px solid #e5e7eb; }
  .meta { margin: 24px 0 0; color: #4b5563; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Files</h1>
  <div class="toolbar">
    <input placeholder="Search files" aria-label="Search files">
    <button class="btn"><svg viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" fill="#ffffff"/></svg>Upload</button>
  </div>
  <div class="stack">
    <p>Report-2026.pdf</p>
    <p>Invoices.zip</p>
    <p>Contract.docx</p>
    <p>Notes.txt</p>
  </div>
  <p class="note">Storage is 92% full.</p>
  <div class="tags"><span class="tag">PDF</span><span class="tag">ZIP</span></div>
  <table>
    <thead><tr><th>Name</th><th>Size</th><th class="actions">Actions</th></tr></thead>
    <tbody>
      <tr><td>Report-2026.pdf</td><td>2.1 MB</td><td class="actions"><a href="#">Share</a></td></tr>
      <tr><td>Invoices.zip</td><td>14 MB</td><td class="actions"><a href="#">Share</a></td></tr>
    </tbody>
  </table>
  <div class="panel">This summary panel fits a phone screen.</div>
  <p class="meta">Shared with 3 people. Last change 2 hours ago.</p>
</main>
</body>
</html>
